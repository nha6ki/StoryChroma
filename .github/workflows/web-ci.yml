name: Web CI

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/web-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint
